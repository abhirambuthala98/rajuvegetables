<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAJU VEGETABLES</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f4;color:#172019}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
:root{--g:#16803c;--gd:#0b5d2b;--light:#eaf7ee;--border:#dce5de;--muted:#68746c;--red:#c62828;--card:#fff}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(900px,100%)}.brand{text-align:center;margin-bottom:28px}.logo{width:75px;height:75px;border-radius:22px;background:var(--g);color:white;display:grid;place-items:center;margin:auto;font-weight:800;font-size:25px}.brand h1{margin:14px 0 6px}.muted{color:var(--muted)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:18px}.role,.card{background:white;border:1px solid var(--border);border-radius:18px}.role{padding:30px;text-align:left}.role:hover{border-color:var(--g)}.role b{display:block;font-size:21px;margin:12px 0 7px}.role span{font-size:38px}
.form{max-width:450px;margin:auto;padding:26px}.form h2{margin:0 0 7px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px;background:white;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--g)}
.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:var(--g);color:white}.secondary{background:var(--light);color:var(--gd)}.danger{background:#fdecec;color:var(--red)}.full{width:100%}
.layout{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:#103b20;color:white;padding:18px;position:sticky;top:0;height:100vh}.side h3{margin:0 0 3px}.side small{color:#b5cfbc}.nav{margin-top:25px}.nav button{display:block;width:100%;border:0;background:transparent;color:#e0eee4;text-align:left;padding:11px;border-radius:9px;margin:3px 0}.nav button.active,.nav button:hover{background:#1b6134}.side .logout{margin-top:20px;width:100%;background:white;color:var(--red)}
main{padding:22px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h2{margin:3px 0 0;font-size:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{padding:17px;margin-bottom:16px}.stat .num{font-size:26px;font-weight:800;margin-top:8px}.stat .label{color:var(--muted);font-size:13px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:10px;border-bottom:1px solid var(--border);font-size:13px;text-align:left}.table th{background:#f7faf7}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:var(--light);color:var(--gd);font-weight:700;font-size:12px}.redpill{background:#fdecec;color:var(--red)}.empty{text-align:center;color:var(--muted);padding:25px}.pricegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.price{padding:16px;border:1px solid var(--border);border-radius:14px;background:#fbfdfb}.billline{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 40px;gap:7px;margin-bottom:8px;align-items:end}.bill-total{font-size:22px;font-weight:800;text-align:right;margin-top:15px}.sharebox{white-space:pre-wrap;background:#f7faf7;border:1px solid var(--border);padding:15px;border-radius:10px;font-size:13px}.mobile{display:none}
.toast{position:fixed;right:18px;bottom:18px;background:#173d24;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:99}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#103b20;z-index:20;overflow:auto}.mobile button{flex:1;min-width:78px;border:0;background:none;color:white;padding:9px 3px;font-size:11px}.grid{grid-template-columns:1fr 1fr}main{padding-bottom:75px}}
@media(max-width:650px){.roles,.grid2,.formgrid,.pricegrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.billline{grid-template-columns:1.5fr .8fr .8fr .9fr 35px}.top h2{font-size:22px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
"use strict";
const KEY="raju_vegetables_final_v1";
let user=null, ownerPage="dashboard", customerPage="dashboard";

function seed(){
 return {settings:{name:"RAJU VEGETABLES",target:1000},
 users:[{id:"owner",role:"owner",name:"Owner",login:"owner",password:"1234"},
        {id:"customer1",role:"customer",name:"Demo Customer",login:"customer",password:"1234",phone:"9999999999"}],
 customers:[{id:"customer1",name:"Demo Customer",phone:"9999999999",address:"",openingDue:0}],
 purchases:[],sales:[],payments:[],expenses:[],prices:[],dealers:[]
 };
}
function db(){let x=localStorage.getItem(KEY);if(!x){x=seed();localStorage.setItem(KEY,JSON.stringify(x));return x}try{return JSON.parse(x)}catch(e){x=seed();localStorage.setItem(KEY,JSON.stringify(x));return x}}
function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
function id(p){return p+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)}
function date(){return new Date().toISOString().slice(0,10)}
function money(n){return "₹"+Number(n||0).toFixed(2)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function sum(a,f){return a.reduce((v,x)=>v+Number(f(x)||0),0)}
function msg(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",1600)}
function profit(d){
 const x=db(), ss=x.sales.filter(s=>s.date===d), ee=x.expenses.filter(e=>e.date===d);
 let cogs=0;
 ss.forEach(s=>{let ps=x.purchases.filter(p=>p.name.toLowerCase()===s.name.toLowerCase()&&p.date<=d);
   let q=sum(ps,p=>p.qty),c=sum(ps,p=>p.total); cogs+=s.qty*(q?c/q:0)
 });
 let revenue=sum(ss,s=>s.total),expense=sum(ee,e=>e.amount);
 return {revenue,cogs,expense,profit:revenue-cogs-expense};
}
function due(c){
 const x=db(), sales=sum(x.sales.filter(s=>s.customerId===c.id),s=>s.total);
 const pays=sum(x.payments.filter(p=>p.customerId===c.id),p=>p.amount);
 return Number(c.openingDue||0)+sales-pays;
}
function customerName(cid){return db().customers.find(c=>c.id===cid)?.name||"Cash"}

function roleScreen(){
 document.getElementById("app").innerHTML=`<div class="login"><div class="loginbox"><div class="brand"><div class="logo">RV</div><h1>RAJU VEGETABLES</h1><p class="muted">Vegetable Business Management</p></div>
 <div class="roles"><button class="role" onclick="loginScreen('owner')"><span>🔐</span><b>Staff / Owner</b><small class="muted">Purchases, sales, stock, customers, payments, expenses and reports.</small></button>
 <button class="role" onclick="loginScreen('customer')"><span>👤</span><b>Customer</b><small class="muted">Own bills, payments, due, ledger and today's prices.</small></button></div></div></div>`;
}
function loginScreen(r){
 document.getElementById("app").innerHTML=`<div class="login"><div class="card form"><button class="btn secondary" onclick="roleScreen()">← Back</button><div style="font-size:36px;margin-top:18px">${r==="owner"?"🔐":"👤"}</div><h2>${r==="owner"?"Staff / Owner Login":"Customer Login"}</h2><p class="muted">${r==="owner"?"Authorized business access":"Access your own account"}</p>
 <label>Login</label><input id="li" placeholder="Username / mobile"><label>Password</label><input id="pw" type="password" placeholder="Password">
 <button class="btn primary full" style="margin-top:18px" onclick="doLogin('${r}')">Login</button>
 <p class="muted" style="font-size:12px;margin-top:15px">Demo owner: owner / 1234 &nbsp; | &nbsp; customer: customer / 1234</p></div></div>`;
}
function doLogin(r){let x=db(),u=x.users.find(a=>a.role===r&&(a.login===document.getElementById("li").value.trim()||a.phone===document.getElementById("li").value.trim())&&a.password===document.getElementById("pw").value);if(!u)return alert("Invalid login.");user=u;r==="owner"?owner("dashboard"):customer("dashboard")}
function logout(){user=null;roleScreen()}

const ownerNav={dashboard:"🏠 Dashboard",purchases:"🛒 Purchases",inventory:"📦 Inventory",sales:"💰 Sales",customers:"👥 Customers",payments:"💳 Payments",expenses:"💸 Expenses",prices:"🏷️ Prices",profit:"📈 Profit",reports:"📊 Reports"};
function owner(page){
 ownerPage=page;let nav=Object.entries(ownerNav).map(([k,v])=>`<button class="${k===page?"active":""}" onclick="owner('${k}')">${v}</button>`).join("");
 document.getElementById("app").innerHTML=`<div class="layout"><aside class="side"><h3>🥬 RAJU VEGETABLES</h3><small>Owner Panel</small><div class="nav">${nav}</div><button class="btn logout" onclick="logout()">Logout</button></aside><main><div class="top"><div><span class="muted">${new Date().toLocaleDateString()}</span><h2>${ownerNav[page].replace(/^\\S+ /,"")}</h2></div></div><div id="content"></div></main></div><div class="mobile">${nav}</div>`;
 let html={dashboard:ownerDash,purchases:purchasePage,inventory:inventoryPage,sales:salesPage,customers:customersPage,payments:paymentPage,expenses:expensePage,prices:pricePage,profit:profitPage,reports:reportPage}[page]();document.getElementById("content").innerHTML=html;
}
function ownerDash(){
 let x=db(),p=profit(date()),dueAll=sum(x.customers,due);
 return `<div class="grid"><div class="card stat"><div class="label">Today's Sales</div><div class="num">${money(p.revenue)}</div></div><div class="card stat"><div class="label">Today's Expenses</div><div class="num">${money(p.expense)}</div></div><div class="card stat"><div class="label">Net Profit</div><div class="num">${money(p.profit)}</div></div><div class="card stat"><div class="label">Customer Due</div><div class="num">${money(dueAll)}</div></div></div>
 <div class="grid2"><div class="card"><h3>Quick Actions</h3><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="owner('purchases')">+ Purchase</button><button class="btn primary" onclick="owner('sales')">+ Sale / Bill</button><button class="btn secondary" onclick="owner('customers')">+ Customer</button><button class="btn secondary" onclick="owner('payments')">+ Payment</button><button class="btn secondary" onclick="owner('expenses')">+ Expense</button></div></div>
 <div class="card"><h3>Daily Rule</h3><p class="muted" style="margin-top:9px">Net profit = sales − estimated cost of vegetables sold − expenses. Unsold stock carries forward.</p></div></div>`;
}
function purchasePage(){
 let x=db();return `<div class="card"><form onsubmit="event.preventDefault();addPurchase(this)"><div class="formgrid"><div><label>Date</label><input name="date" type="date" value="${date()}"></div><div><label>Vegetable</label><input name="name" required placeholder="Tomato"></div><div><label>Purchase Type</label><select name="unit"><option>Box</option><option>Bag</option><option>Kg</option><option>Piece</option></select></div><div><label>Quantity</label><input name="qty" type="number" min="0.01" step="0.01" required></div><div><label>Weight / unit (kg)</label><input name="weight" type="number" min="0" step="0.01"></div><div><label>Price / unit (₹)</label><input name="cost" type="number" min="0" step="0.01" required></div><div><label>Dealer</label><input name="dealer" placeholder="Dealer name"></div></div><button class="btn primary" style="margin-top:15px">Save Purchase</button></form></div>
 <div class="section"><h3>Purchase History</h3></div><div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Vegetable</th><th>Type</th><th>Qty</th><th>Weight</th><th>Price</th><th>Total</th></tr>${x.purchases.slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${esc(p.name)}</td><td>${p.unit}</td><td>${p.qty}</td><td>${p.weight||"-"} kg</td><td>${money(p.cost)}</td><td>${money(p.total)}</td></tr>`).join("")||`<tr><td colspan="7" class="empty">No purchases yet.</td></tr>`}</table></div>`;
}
function addPurchase(f){let x=db(),d=new FormData(f),q=+d.get("qty"),c=+d.get("cost");if(q<=0||c<0)return alert("Enter valid values.");x.purchases.push({id:id("pur"),date:d.get("date")||date(),name:d.get("name").trim(),unit:d.get("unit"),qty:q,weight:+d.get("weight")||0,cost:c,total:q*c,dealer:d.get("dealer")||""});save(x);msg("Purchase saved");owner("purchases")}
function inventoryPage(){
 let x=db(),m={};x.purchases.forEach(p=>{let k=p.name.toLowerCase();m[k]??={name:p.name,qty:0,value:0};m[k].qty+=p.qty;m[k].value+=p.total});x.sales.forEach(s=>{let k=s.name.toLowerCase();if(m[k])m[k].qty-=s.qty});
 return `<div class="card"><p class="muted">Available quantity = purchases − recorded sales. Unsold stock remains available.</p></div><div class="card tablewrap"><table class="table"><tr><th>Vegetable</th><th>Available Qty</th><th>Purchase Value</th><th>Avg Cost / unit</th></tr>${Object.values(m).map(v=>`<tr><td>${esc(v.name)}</td><td>${v.qty.toFixed(2)}</td><td>${money(v.value)}</td><td>${v.qty?money(v.value/v.qty):money(0)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No inventory.</td></tr>`}</table></div>`;
}
function salesPage(){
 let x=db();return `<div class="card"><h3>Create Sale / Customer Bill</h3><form id="billform" onsubmit="event.preventDefault();saveBill()"><div class="formgrid"><div><label>Date</label><input id="bdate" type="date" value="${date()}"></div><div><label>Customer</label><select id="bcustomer"><option value="">Cash / Walk-in</option>${x.customers.map(c=>`<option value="${c.id}">${esc(c.name)} - ${esc(c.phone||"")}</option>`).join("")}</select></div></div><div style="margin-top:16px"><label>Bill Items</label><div id="billitems"></div><button type="button" class="btn secondary" onclick="addBillLine()">+ Add Vegetable</button></div><div class="bill-total">Total: <span id="btotal">₹0.00</span></div><div class="formgrid"><div><label>Amount Paid</label><input id="bpaid" type="number" min="0" step="0.01" value="0"></div><div><label>Payment Method</label><select id="bmethod"><option>Cash</option><option>UPI</option><option>Bank</option></select></div></div><div class="actions" style="margin-top:16px"><button class="btn primary">Save Bill</button></div></form></div>
 <div class="section"><h3>Recent Bills</h3></div><div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Customer</th><th>Total</th><th>Paid</th><th>Due</th><th>Action</th></tr>${x.sales.filter(s=>s.billId).reduce((a,s)=>{let z=a.find(v=>v.billId===s.billId);if(!z){z={billId:s.billId,date:s.date,customerId:s.customerId,total:0,paid:0};a.push(z)}z.total+=s.total;return a},[]).slice().reverse().map(b=>{let paid=x.payments.filter(p=>p.billId===b.billId).reduce((a,p)=>a+p.amount,0);return `<tr><td>${b.date}</td><td>${customerName(b.customerId)}</td><td>${money(b.total)}</td><td>${money(paid)}</td><td>${money(b.total-paid)}</td><td><button class="btn secondary" onclick="showBill('${b.billId}')">View / Share</button></td></tr>`}).join("")||`<tr><td colspan="6" class="empty">No bills yet.</td></tr>`}</table></div>`;
}
let billLines=[];
function addBillLine(){billLines.push({name:"",qty:1,price:0});renderBillLines()}
function renderBillLines(){let el=document.getElementById("billitems");if(!el)return;el.innerHTML=billLines.map((b,i)=>`<div class="billline"><div><input placeholder="Vegetable" value="${esc(b.name)}" oninput="billLines[${i}].name=this.value"></div><div><input type="number" min="0.01" step="0.01" value="${b.qty}" oninput="billLines[${i}].qty=+this.value;updateBillTotal()"></div><div><input type="number" min="0" step="0.01" value="${b.price}" oninput="billLines[${i}].price=+this.value;updateBillTotal()"></div><div class="lineTotal">${money(b.qty*b.price)}</div><button type="button" class="btn danger" onclick="billLines.splice(${i},1);renderBillLines()">×</button></div>`).join("")||`<p class="muted">Add at least one vegetable.</p>`;updateBillTotal()}
function updateBillTotal(){let t=sum(billLines,b=>b.qty*b.price);let e=document.getElementById("btotal");if(e)e.textContent=money(t);document.querySelectorAll(".lineTotal").forEach((e,i)=>e.textContent=money(billLines[i].qty*billLines[i].price))}
function saveBill(){
 let x=db(),cust=document.getElementById("bcustomer").value||null,d=document.getElementById("bdate").value||date(),paid=+document.getElementById("bpaid").value||0,total=sum(billLines,b=>b.qty*b.price);
 if(!billLines.length||billLines.some(b=>!b.name||b.qty<=0||b.price<0))return alert("Add valid bill items.");
 if(paid>total)return alert("Payment cannot exceed bill total.");
 let bid=id("bill");
 billLines.forEach(b=>x.sales.push({id:id("sale"),billId:bid,date:d,name:b.name.trim(),qty:+b.qty,price:+b.price,total:b.qty*b.price,customerId:cust}));
 if(cust&&paid>0)x.payments.push({id:id("pay"),date:d,customerId:cust,amount:paid,method:document.getElementById("bmethod").value,billId:bid});
 save(x);billLines=[];msg("Bill saved");showBill(bid)}
function showBill(bid){
 let x=db(),items=x.sales.filter(s=>s.billId===bid);if(!items.length)return;let total=sum(items,s=>s.total),paid=sum(x.payments.filter(p=>p.billId===bid),p=>p.amount),dueAmt=total-paid,c=items[0].customerId?x.customers.find(c=>c.id===items[0].customerId):null;
 let text=`RAJU VEGETABLES\\nCUSTOMER BILL\\nDate: ${items[0].date}\\nCustomer: ${c?c.name:"Cash Customer"}${c?.phone?"\\nPhone: "+c.phone:""}\\n\\n`;
 items.forEach(i=>text+=`${i.name} - ${i.qty} × ${money(i.price)} = ${money(i.total)}\\n`);
 text+=`\\nTOTAL: ${money(total)}\\nPAID: ${money(paid)}\\nBALANCE DUE: ${money(dueAmt)}`;
 document.getElementById("content").innerHTML=`<div class="card"><h3>Bill ${bid}</h3><div class="sharebox" id="sharetext">${esc(text)}</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="shareText(${JSON.stringify(text)})">📤 Share Bill</button><button class="btn secondary" onclick="printBill(${JSON.stringify(text)})">🖨️ Print</button><button class="btn secondary" onclick="owner('sales')">← Back to Bills</button></div></div>`;
}
async function shareText(t){if(navigator.share){try{await navigator.share({title:"RAJU VEGETABLES Bill",text:t})}catch(e){}}else{await navigator.clipboard.writeText(t);alert("Bill copied. Paste it into WhatsApp.")}}
function printBill(t){let w=window.open("","_blank","width=500,height=700");w.document.write("<pre style='font:16px Arial;white-space:pre-wrap;padding:25px'>"+esc(t)+"</pre>");w.print();w.close()}
function customersPage(){
 let x=db();return `<div class="card"><form onsubmit="event.preventDefault();addCustomer(this)"><div class="formgrid"><div><label>Name</label><input name="name" required></div><div><label>Phone</label><input name="phone"></div><div><label>Address</label><input name="address"></div><div><label>Opening Due</label><input name="openingDue" type="number" step="0.01" value="0"></div></div><button class="btn primary" style="margin-top:15px">Add Customer</button></form></div><div class="card tablewrap"><table class="table"><tr><th>Customer</th><th>Phone</th><th>Due</th><th>Actions</th></tr>${x.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone||"")}</td><td><span class="pill ${due(c)>0?"redpill":""}">${money(due(c))}</span></td><td><button class="btn secondary" onclick="customerDetail('${c.id}')">Ledger / Statement</button></td></tr>`).join("")}</table></div>`;
}
function addCustomer(f){let x=db(),d=new FormData(f);x.customers.push({id:id("cust"),name:d.get("name").trim(),phone:d.get("phone")||"",address:d.get("address")||"",openingDue:+d.get("openingDue")||0});save(x);msg("Customer added");owner("customers")}
function customerDetail(cid){
 let x=db(),c=x.customers.find(c=>c.id===cid),lines=[];if(c.openingDue)lines.push({date:"Opening",desc:"Opening Due",amount:c.openingDue});
 x.sales.filter(s=>s.customerId===cid).forEach(s=>lines.push({date:s.date,desc:"Bill - "+s.name,amount:s.total,bill:s.billId}));
 x.payments.filter(p=>p.customerId===cid).forEach(p=>lines.push({date:p.date,desc:"Payment - "+p.method,amount:-p.amount,bill:p.billId}));
 let bal=0;let text=`RAJU VEGETABLES\\nCUSTOMER STATEMENT\\nCustomer: ${c.name}\\nPhone: ${c.phone||"-"}\\n\\n`;
 lines.forEach(r=>{bal+=r.amount;text+=`${r.date} | ${r.desc} | ${money(r.amount)} | Balance ${money(bal)}\\n`});text+=`\\nCURRENT DUE: ${money(due(c))}`;
 document.getElementById("content").innerHTML=`<div class="card"><h3>${esc(c.name)} — Statement</h3><p class="muted">${esc(c.phone||"")} ${esc(c.address||"")}</p><div class="sharebox" style="margin-top:15px">${esc(text)}</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="shareText(${JSON.stringify(text)})">📤 Share Statement</button><button class="btn secondary" onclick="owner('customers')">← Back</button></div></div><div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Description</th><th>Amount</th><th>Balance</th></tr>${(()=>{let b=0;return lines.map(r=>{b+=r.amount;return `<tr><td>${r.date}</td><td>${esc(r.desc)}</td><td>${r.amount>=0?money(r.amount):"-"+money(-r.amount)}</td><td>${money(b)}</td></tr>`}).join("")})()}</table></div>`;
}
function paymentPage(){
 let x=db();return `<div class="card"><form onsubmit="event.preventDefault();addPayment(this)"><div class="formgrid"><div><label>Date</label><input name="date" type="date" value="${date()}"></div><div><label>Customer</label><select name="customer" required><option value="">Select</option>${x.customers.map(c=>`<option value="${c.id}">${esc(c.name)} — Due ${money(due(c))}</option>`).join("")}</select></div><div><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Method</label><select name="method"><option>Cash</option><option>UPI</option><option>Bank</option></select></div></div><button class="btn primary" style="margin-top:15px">Record Payment</button></form></div><div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Customer</th><th>Amount</th><th>Method</th></tr>${x.payments.slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${esc(customerName(p.customerId))}</td><td>${money(p.amount)}</td><td>${p.method}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No payments.</td></tr>`}</table></div>`;
}
function addPayment(f){let x=db(),d=new FormData(f),a=+d.get("amount"),c=x.customers.find(c=>c.id===d.get("customer"));if(!c||a<=0)return alert("Enter valid payment.");if(a>due(c)+0.001)return alert("Payment cannot exceed current due.");x.payments.push({id:id("pay"),date:d.get("date")||date(),customerId:c.id,amount:a,method:d.get("method")});save(x);msg("Payment recorded");owner("payments")}
function expensePage(){
 let x=db();return `<div class="card"><form onsubmit="event.preventDefault();addExpense(this)"><div class="formgrid"><div><label>Date</label><input name="date" type="date" value="${date()}"></div><div><label>Expense Type</label><select name="type"><option>Worker Fee</option><option>Covers Fee</option><option>Swachh Bharat Workers Tips</option><option>Transport</option><option>Loading / Unloading</option><option>Market Fee</option><option>Food / Tea</option><option>Other</option></select></div><div><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Notes</label><input name="notes"></div></div><button class="btn primary" style="margin-top:15px">Save Expense</button></form></div><div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Type</th><th>Notes</th><th>Amount</th></tr>${x.expenses.slice().reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.type)}</td><td>${esc(e.notes||"")}</td><td>${money(e.amount)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No expenses.</td></tr>`}</table></div>`;
}
function addExpense(f){let x=db(),d=new FormData(f);x.expenses.push({id:id("exp"),date:d.get("date")||date(),type:d.get("type"),amount:+d.get("amount"),notes:d.get("notes")||""});save(x);msg("Expense saved");owner("expenses")}
function pricePage(){
 let x=db();return `<div class="card"><form onsubmit="event.preventDefault();setPrice(this)"><div class="formgrid"><div><label>Date</label><input name="date" type="date" value="${date()}"></div><div><label>Vegetable</label><input name="name" required></div><div><label>Selling Price / kg</label><input name="price" type="number" min="0" step="0.01" required></div></div><button class="btn primary" style="margin-top:15px">Set Price</button></form></div><div class="pricegrid">${x.prices.filter(p=>p.date===date()).map(p=>`<div class="price"><h3>${esc(p.name)}</h3><strong style="font-size:22px">${money(p.price)}</strong><p class="muted">per kg</p></div>`).join("")||`<div class="card empty">No prices set today.</div>`}</div>`;
}
function setPrice(f){let x=db(),d=new FormData(f),dt=d.get("date")||date(),n=d.get("name").trim();x.prices=x.prices.filter(p=>!(p.date===dt&&p.name.toLowerCase()===n.toLowerCase()));x.prices.push({id:id("price"),date:dt,name:n,price:+d.get("price"),unit:"kg"});save(x);msg("Price saved");owner("prices")}
function profitPage(){let p=profit(date()),target=db().settings.target;return `<div class="grid"><div class="card stat"><div class="label">Sales</div><div class="num">${money(p.revenue)}</div></div><div class="card stat"><div class="label">Estimated COGS</div><div class="num">${money(p.cogs)}</div></div><div class="card stat"><div class="label">Expenses</div><div class="num">${money(p.expense)}</div></div><div class="card stat"><div class="label">Net Profit</div><div class="num">${money(p.profit)}</div></div></div><div class="card"><h3>Minimum Daily Profit Target</h3><p class="muted">Current target: ${money(target)}</p><form onsubmit="event.preventDefault();let x=db();x.settings.target=+document.getElementById('target').value||0;save(x);msg('Target updated');owner('profit')"><label>Change target</label><input id="target" type="number" step="0.01" value="${target}"><button class="btn primary" style="margin-top:12px">Save Target</button></form></div>`}
function reportPage(){let x=db(),ds=[...new Set([...x.sales.map(s=>s.date),...x.expenses.map(e=>e.date),...x.purchases.map(p=>p.date)])].sort().reverse();return `<div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Sales</th><th>COGS</th><th>Expenses</th><th>Net Profit</th></tr>${ds.map(d=>{let p=profit(d);return `<tr><td>${d}</td><td>${money(p.revenue)}</td><td>${money(p.cogs)}</td><td>${money(p.expense)}</td><td>${money(p.profit)}</td></tr>`}).join("")||`<tr><td colspan="5" class="empty">No report data.</td></tr>`}</table></div>`}

const customerNav={dashboard:"🏠 Dashboard",prices:"🏷️ Today's Prices",bills:"🧾 My Bills",payments:"💳 My Payments",ledger:"📄 My Ledger",profile:"👤 Profile"};
function customer(page){
 customerPage=page;let nav=Object.entries(customerNav).map(([k,v])=>`<button class="${k===page?"active":""}" onclick="customer('${k}')">${v}</button>`).join("");
 document.getElementById("app").innerHTML=`<div class="layout"><aside class="side"><h3>🥬 RAJU VEGETABLES</h3><small>Customer Portal</small><div class="nav">${nav}</div><button class="btn logout" onclick="logout()">Logout</button></aside><main><div class="top"><div><span class="muted">${new Date().toLocaleDateString()}</span><h2>${customerNav[page].replace(/^\\S+ /,"")}</h2></div></div><div id="content"></div></main></div><div class="mobile">${nav}</div>`;
 document.getElementById("content").innerHTML={dashboard:customerDash,prices:customerPrices,bills:customerBills,payments:customerPayments,ledger:customerLedger,profile:customerProfile}[page]();
}
function myCustomer(){let x=db();return x.customers.find(c=>c.id===user.id)||x.customers.find(c=>c.phone===user.phone)||{id:user.id,name:user.name,phone:user.phone,openingDue:0}}
function customerDash(){let c=myCustomer(),x=db();return `<div class="grid"><div class="card stat"><div class="label">Current Due</div><div class="num">${money(due(c))}</div></div><div class="card stat"><div class="label">Bills</div><div class="num">${x.sales.filter(s=>s.customerId===c.id&&s.billId).map(s=>s.billId).filter((v,i,a)=>a.indexOf(v)===i).length}</div></div><div class="card stat"><div class="label">Payments</div><div class="num">${money(sum(x.payments.filter(p=>p.customerId===c.id),p=>p.amount))}</div></div><div class="card stat"><div class="label">Prices Today</div><div class="num">${x.prices.filter(p=>p.date===date()).length}</div></div></div><div class="card"><h3>Welcome, ${esc(c.name)}</h3><p class="muted" style="margin-top:8px">This account can only access its own bills, payments, due and published prices.</p></div>`}
function customerPrices(){let x=db();return `<div class="pricegrid">${x.prices.filter(p=>p.date===date()).map(p=>`<div class="price"><h3>${esc(p.name)}</h3><strong style="font-size:22px">${money(p.price)}</strong><p class="muted">per ${p.unit}</p></div>`).join("")||`<div class="card empty">Prices have not been published yet.</div>`}</div>`}
function customerBills(){let c=myCustomer(),x=db(),bs=[...new Set(x.sales.filter(s=>s.customerId===c.id&&s.billId).map(s=>s.billId))];return `<div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Total</th><th>Paid</th><th>Balance</th><th></th></tr>${bs.map(b=>{let it=x.sales.filter(s=>s.billId===b),t=sum(it,s=>s.total),p=sum(x.payments.filter(q=>q.billId===b),q=>q.amount);return `<tr><td>${it[0].date}</td><td>${money(t)}</td><td>${money(p)}</td><td>${money(t-p)}</td><td><button class="btn secondary" onclick="customerBill('${b}')">View</button></td></tr>`}).join("")||`<tr><td colspan="5" class="empty">No bills.</td></tr>`}</table></div>`}
function customerBill(bid){let x=db(),it=x.sales.filter(s=>s.billId===bid),t=sum(it,s=>s.total),p=sum(x.payments.filter(q=>q.billId===bid),q=>q.amount);let text="RAJU VEGETABLES\\nCUSTOMER BILL\\nDate: "+it[0].date+"\\n\\n";it.forEach(i=>text+=`${i.name} - ${i.qty} × ${money(i.price)} = ${money(i.total)}\\n`);text+=`\\nTOTAL: ${money(t)}\\nPAID: ${money(p)}\\nBALANCE DUE: ${money(t-p)}`;document.getElementById("content").innerHTML=`<div class="card"><div class="sharebox">${esc(text)}</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="shareText(${JSON.stringify(text)})">📤 Share</button><button class="btn secondary" onclick="customer('bills')">← Back</button></div></div>`}
function customerPayments(){let c=myCustomer(),x=db();return `<div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Amount</th><th>Method</th></tr>${x.payments.filter(p=>p.customerId===c.id).slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${money(p.amount)}</td><td>${p.method}</td></tr>`).join("")||`<tr><td colspan="3" class="empty">No payments.</td></tr>`}</table></div>`}
function customerLedger(){let c=myCustomer(),x=db(),rows=[];if(c.openingDue)rows.push({date:"Opening",desc:"Opening Due",amt:c.openingDue});x.sales.filter(s=>s.customerId===c.id).forEach(s=>rows.push({date:s.date,desc:"Bill - "+s.name,amt:s.total}));x.payments.filter(p=>p.customerId===c.id).forEach(p=>rows.push({date:p.date,desc:"Payment",amt:-p.amount}));let b=0;return `<div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Description</th><th>Amount</th><th>Balance</th></tr>${rows.map(r=>{b+=r.amt;return `<tr><td>${r.date}</td><td>${esc(r.desc)}</td><td>${r.amt>=0?money(r.amt):"-"+money(-r.amt)}</td><td>${money(b)}</td></tr>`}).join("")||`<tr><td colspan="4" class="empty">No ledger entries.</td></tr>`}</table></div>`}
function customerProfile(){let c=myCustomer();return `<div class="card"><h3>${esc(c.name)}</h3><p class="muted" style="margin-top:10px">Phone: ${esc(c.phone||"-")}</p><p class="muted">Address: ${esc(c.address||"-")}</p></div>`}

if(!localStorage.getItem(KEY))save(seed());
roleScreen();
</script>
</body>

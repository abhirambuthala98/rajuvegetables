/* RAJU VEGETABLES opening splash */
.splash-screen{position:fixed;inset:0;z-index:100000;background:linear-gradient(145deg,#071f12 0%,#0b5d2b 52%,#16803c 100%);display:grid;place-items:center;overflow:hidden;animation:splashExit .8s ease 4.35s forwards}

.splash-logo:before{content:"";position:absolute;width:58px;height:30px;background:#9be15d;border-radius:100% 0 100% 0;transform:rotate(-35deg) translate(-5px,-5px);box-shadow:inset 8px -3px 0 rgba(255,255,255,.18)}
.splash-logo:after{content:"";position:absolute;width:4px;height:47px;background:#dff6c9;transform:rotate(34deg) translate(17px,2px);border-radius:5px}
.splash-rv{position:relative;z-index:2;font-size:25px;font-weight:950;letter-spacing:1px;color:#0b5d2b;background:#fff;border-radius:14px;padding:7px 9px;box-shadow:0 8px 18px rgba(0,0,0,.16)}

@keyframes splashIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}

@keyframes splashGlow{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.08);opacity:1}}

/* =========================================================
   RAJU VEGETABLES — PREMIUM DESIGN SYSTEM
   Canva-inspired visual language, optimized for daily use.
   ========================================================= */
:root{
  --g:#45a94d;
  --gd:#287a36;
  --gdeep:#1f6130;
  --mint:#eef8f0;
  --mint2:#e4f3e6;
  --gold:#d1ad2d;
  --gold-soft:#fff7d7;
  --ink:#183022;
  --muted:#718076;
  --border:#dbe9de;
  --shadow:0 10px 30px rgba(31,97,48,.08);
  --shadow-lg:0 18px 48px rgba(31,97,48,.12);
}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f8f5;color:var(--ink)}
button,input,select,textarea{font-family:inherit}
::selection{background:#d8f0da;color:var(--gdeep)}

/* App chrome */
.layout{grid-template-columns:250px 1fr;background:#f4f8f5}
.side{background:rgba(255,255,255,.96);color:var(--ink);border-right:1px solid var(--border);padding:22px 16px;box-shadow:7px 0 24px rgba(31,97,48,.04);backdrop-filter:blur(10px)}
.side h3{font-size:20px;letter-spacing:-.3px;color:var(--gdeep)}
.side small{color:#7a887f}
.nav{margin-top:28px}
.nav button{color:#55645b;padding:12px 13px;border-radius:12px;font-weight:700;transition:all .18s ease}
.nav button:hover{background:#eef8f0;color:var(--gdeep);transform:translateX(2px)}
.nav button.active{background:linear-gradient(90deg,#e6f6e8,#f3faf4);color:var(--gdeep);box-shadow:inset 3px 0 0 var(--g)}
.side .logout{color:#b22b2b;background:#fff6f6;border:1px solid #f1d1d1}
main{padding:28px 32px 90px;max-width:1440px;width:100%;margin:0 auto}
.top{position:sticky;top:0;z-index:15;background:rgba(244,248,245,.9);backdrop-filter:blur(12px);padding:6px 0 16px;margin-bottom:22px}
.top h2{font-size:30px;font-weight:850;color:var(--ink);letter-spacing:-.8px}
.top .muted{font-size:12px;font-weight:700;letter-spacing:.3px}
.top:after{width:52px;height:4px;background:var(--g);margin-top:42px}

/* Core cards / forms */
.card,.role{background:rgba(255,255,255,.98);border:1px solid rgba(219,233,222,.9);border-radius:22px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.card:hover{box-shadow:var(--shadow-lg)}
.card h3,.card h4{color:var(--ink)}
.form label{font-size:12px;color:#496052;letter-spacing:.1px}
input,select,textarea{border:1px solid #d8e5db;border-radius:13px;padding:13px 14px;background:#fff;color:var(--ink);transition:border-color .18s ease,box-shadow .18s ease}
input:focus,select:focus,textarea:focus{border-color:#67b06f;box-shadow:0 0 0 4px rgba(69,169,77,.1)}
.btn{border-radius:12px;padding:12px 16px;min-height:44px;font-weight:800;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.btn:hover{transform:translateY(-1px)}
.primary{background:linear-gradient(135deg,#43a34c,#2f8d3b);box-shadow:0 8px 18px rgba(47,141,59,.18)}
.secondary{background:#edf8ef;color:var(--gdeep)}
.danger{background:#fff0f0;color:#b42323}

/* Premium dashboard */
.dashboard-hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:28px 30px;margin-bottom:24px;background:linear-gradient(135deg,#eaf7ed 0%,#f9fcfa 58%,#fffdf5 100%);border:1px solid #dcece0;border-radius:28px;box-shadow:var(--shadow)}
.dashboard-hero:before,.dashboard-hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.dashboard-hero:before{width:230px;height:230px;right:-70px;top:-95px;background:rgba(69,169,77,.10)}
.dashboard-hero:after{width:160px;height:160px;left:-85px;bottom:-95px;background:rgba(209,173,45,.10)}
.hero-copy,.hero-badge{position:relative;z-index:1}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.4px;color:var(--gdeep);text-transform:uppercase;margin-bottom:9px}
.dashboard-hero h1{font-size:34px;line-height:1.05;letter-spacing:-1px;margin:0 0 10px;font-weight:900;color:#23452d}
.dashboard-hero h1 span{font-size:28px}
.dashboard-hero p{margin:0;color:#66756b;font-size:14px;max-width:640px}
.hero-badge{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(255,255,255,.82);border:1px solid #dce9df;border-radius:18px;box-shadow:0 10px 22px rgba(31,97,48,.07);min-width:150px}

.dashboard-section-title{display:flex;justify-content:space-between;align-items:end;margin:22px 2px 11px}
.dashboard-section-title h3{margin:0;font-size:18px;letter-spacing:-.4px}
.dashboard-section-title p{margin:4px 0 0;font-size:12px}
.dashboard-stats{gap:14px}
.premium-stat{position:relative;overflow:hidden;padding:19px 18px 17px;border-radius:20px;min-height:150px}
.premium-stat:after{content:"";position:absolute;right:-34px;bottom:-36px;width:105px;height:105px;border-radius:50%;background:rgba(255,255,255,.6)}
.premium-stat .stat-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;margin-bottom:13px;position:relative;z-index:1}
.premium-stat .label{font-size:12px;font-weight:800;color:#617067;position:relative;z-index:1}
.premium-stat .num{font-size:28px;font-weight:900;letter-spacing:-.6px;margin-top:5px;position:relative;z-index:1;color:#1f3526}
.stat-foot{margin-top:6px;color:#849087;font-size:11px;position:relative;z-index:1}
.sales-stat{background:linear-gradient(180deg,#fff,#f1faf2)}.sales-stat .stat-icon{background:#dff2e1}.expense-stat{background:linear-gradient(180deg,#fff,#fffaf0)}.expense-stat .stat-icon{background:#fff0bf}.profit-stat{background:linear-gradient(180deg,#fff,#edf8ef)}.profit-stat .stat-icon{background:#d9f0dc}.due-stat{background:linear-gradient(180deg,#fff,#fff6f6)}.due-stat .stat-icon{background:#ffe5e5}
.quick-title{margin-top:28px}
.premium-quick-grid{grid-template-columns:repeat(5,1fr);gap:12px}
.premium-quick{min-height:145px;padding:16px 13px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;border:1px solid #dce8df;background:#fff;border-radius:19px;box-shadow:var(--shadow)}
.premium-quick span{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:#eff8f0;font-size:23px;margin-bottom:12px}
.premium-quick b{font-size:15px;color:#25472d}
.premium-quick small{font-size:11px;color:#7a887f;margin-top:4px;line-height:1.35}
.premium-quick:hover{transform:translateY(-4px);border-color:#a9d2af;box-shadow:0 16px 30px rgba(31,97,48,.11)}
.dashboard-lower{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.insight-card{display:flex;gap:13px;align-items:flex-start;padding:18px;background:#fff}
.insight-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#e9f7eb;font-size:20px;flex:0 0 auto}
.insight-card h3{margin:0;font-size:15px}.insight-card p{margin:7px 0 0;font-size:12px;line-height:1.55}
.gold-insight .insight-icon{background:var(--gold-soft)}

/* Customer hub */
.customer-hub-head{padding:2px 0}.customer-list{gap:14px}.customer-list-card{border-radius:20px;padding:18px;background:linear-gradient(180deg,#fff,#fbfefb);box-shadow:var(--shadow)}
.customer-list-card:hover{transform:translateY(-2px);border-color:#b9d8be}
.customer-list-name{font-size:18px}.customer-list-phone{font-size:12px}.customer-list-actions .btn{min-height:46px}
.portal-header{background:linear-gradient(135deg,#286f36 0%,#45a94d 72%,#62bb68 100%);box-shadow:0 18px 38px rgba(40,111,54,.18)}
.portal-header .muted{color:#e0f1e3}
.portal-stat{background:rgba(255,255,255,.12)}
.transaction-card{border-radius:16px;background:#fbfefb;box-shadow:0 4px 14px rgba(31,97,48,.04)}

/* Prices */
.pricegrid{gap:14px}.price{border-radius:18px;background:linear-gradient(135deg,#fff,#eff9f1);border:1px solid #dceadf;box-shadow:var(--shadow)}
.price strong{color:var(--gdeep)}

/* Bills */
.bill-total{padding:14px 0;font-size:26px;color:var(--gdeep)}
.sharebox{border-radius:15px;background:#f8fbf8;border-color:#dce9df;line-height:1.7}
.image-preview-card{border-radius:24px}

/* Mobile: make it feel like a native business app */
@media(max-width:900px){
  .layout{grid-template-columns:1fr}.side{display:none}.mobile{background:rgba(31,97,48,.97);backdrop-filter:blur(12px);box-shadow:0 -8px 28px rgba(0,0,0,.08);padding:5px 4px}.mobile button{min-width:72px;padding:10px 4px;font-weight:800}.mobile button:hover{background:rgba(255,255,255,.08)}
}
@media(max-width:700px){
  main{padding:12px 12px 84px}.top{padding-top:3px}.top h2{font-size:24px}.dashboard-hero{padding:21px 18px;border-radius:22px;align-items:flex-start}.dashboard-hero h1{font-size:27px}.dashboard-hero p{font-size:12px;line-height:1.55}.hero-badge{display:none}.eyebrow{font-size:9px;letter-spacing:1px}
  .dashboard-section-title{margin-top:19px}.dashboard-section-title h3{font-size:16px}.premium-stat{min-height:134px;padding:15px;border-radius:18px}.premium-stat .stat-icon{width:38px;height:38px;font-size:19px}.premium-stat .num{font-size:23px}.stat-foot{font-size:10px}.dashboard-stats{gap:9px}.premium-quick-grid{grid-template-columns:1fr 1fr;gap:9px}.premium-quick{min-height:127px;padding:14px 12px}.premium-quick:last-child{grid-column:1/-1;min-height:110px}.dashboard-lower{grid-template-columns:1fr;gap:9px}
  .customer-list{grid-template-columns:1fr}.customer-list-actions{grid-template-columns:1fr}.customer-list-card{padding:16px}.portal-actions{grid-template-columns:1fr}.transaction-card{grid-template-columns:1fr}
  .pricegrid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}
  .actions{gap:8px}.actions .btn{flex:1;min-width:145px}.bill-image{padding:18px}.image-preview-card{padding:11px}
}
@media(max-width:430px){
  .premium-stat .num{font-size:21px}.premium-stat .label{font-size:10px}.premium-quick b{font-size:13px}.premium-quick small{font-size:10px}.mobile button{font-size:10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

function db(){let x=localStorage.getItem(KEY);if(!x){x=seed();localStorage.setItem(KEY,JSON.stringify(x));return x}try{return JSON.parse(x)}catch(e){x=seed();localStorage.setItem(KEY,JSON.stringify(x));return x}}

migrateOwnerLogin()
function id(p){return p+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)}
function date(){return new Date().toISOString().slice(0,10)}
function money(n){return "₹"+Number(n||0).toFixed(2)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function sum(a,f){return a.reduce((v,x)=>v+Number(f(x)||0),0)}
function msg(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",1600)}
function profit(d){
 const x=db(), ss=x.sales.filter(s=>s.date===d), ee=x.expenses.filter(e=>e.date===d);
 let cogs=0;
 ss.forEach(s=>{let ps=x.purchases.filter(p=>p.name.toLowerCase()===s.name.toLowerCase()&&p.date<=d);
   let q=sum(ps,p=>p.qty),c=sum(ps,p=>p.total); cogs+=s.qty*(q?c/q:0)
 });
 let revenue=sum(ss,s=>s.total),expense=sum(ee,e=>e.amount);
 return {revenue,cogs,expense,profit:revenue-cogs-expense};
}
function due(c){
 const x=db(), sales=sum(x.sales.filter(s=>s.customerId===c.id),s=>s.total);
 const pays=sum(x.payments.filter(p=>p.customerId===c.id),p=>p.amount);
 return Number(c.openingDue||0)+sales-pays;
}
function customerName(cid){return db().customers.find(c=>c.id===cid)?.name||"Cash"}

function sameView(a,b){
  if(!a||!b)return false;
  return a.type===b.type&&a.page===b.page&&(a.customerId||null)===(b.customerId||null)&&(a.billId||null)===(b.billId||null);
}
function saveSession(page=ownerPage, customerId=selectedCustomerId){
  try{
    const v=currentView||{type:"ownerPage",page,customerId:customerId||null};
    sessionStorage.setItem(SESSION_KEY,JSON.stringify({userId:user?.id||"owner",role:user?.role||"owner",page,customerId:customerId||null,viewType:v.type,billId:v.billId||null}));
  }catch(e){}
}
function loadSession(){
  try{const raw=sessionStorage.getItem(SESSION_KEY);if(!raw)return null;const s=JSON.parse(raw);if(!s||s.role!=="owner")return null;return s}catch(e){return null}
}
function clearSession(){try{sessionStorage.removeItem(SESSION_KEY)}catch(e){}}
function pushView(view){
  if(currentView&&!sameView(currentView,view))viewStack.push({...currentView});
  currentView={...view};
}
function restoreView(view){
  if(!view){owner("dashboard",{skipHistory:true});return;}
  currentView={...view};
  selectedCustomerId=view.customerId||null;
  if(view.type==="customerDetail"&&view.customerId){customerDetail(view.customerId,{skipHistory:true});return;}
  if(view.type==="bill"&&view.billId){showBill(view.billId,{skipHistory:true});return;}
  owner(view.page||"dashboard",{skipHistory:true});
}
function appBack(){
  if(viewStack.length){const previous=viewStack.pop();restoreView(previous);return;}
  if(currentView&&currentView.type!=="ownerPage"){restoreView({type:"ownerPage",page:"customers",customerId:null});return;}
  owner("dashboard",{skipHistory:true});
}
function doLogin(r){let x=db(),login=document.getElementById("li").value.trim(),password=document.getElementById("pw").value;let normalized=login.toLowerCase();let u=x.users.find(a=>a.role==="owner"&&((a.login||"").toLowerCase()===normalized||normalized==="raju buthala"||(a.name||"").toLowerCase()===normalized)&&a.password===password);if(!u)return alert("Invalid password.");user=u;selectedCustomerId=null;viewStack=[];currentView=null;saveSession("dashboard",null);owner("dashboard",{skipHistory:true})}
function logout(){user=null;selectedCustomerId=null;viewStack=[];currentView=null;clearSession();roleScreen()}

function ownerMoreMenu(){return `<div class="mobile-more-backdrop" id="moreBackdrop" onclick="toggleMoreMenu(false)"></div><div class="mobile-more" id="moreMenu">${Object.entries(ownerNav).filter(([k])=>!["dashboard","sales","customers","payments"].includes(k)).map(([k,v])=>`<button onclick="toggleMoreMenu(false);owner('${k}')">${v}</button>`).join("")}<button onclick="toggleMoreMenu(false);logout()">🚪 Logout</button></div>`}

function ownerDash(){
 let x=db(),p=profit(date()),dueAll=sum(x.customers,due),customerCount=x.customers.length;
 const today=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
 return `<div class="dashboard-hero">
   <div class="hero-copy"><div class="eyebrow">RAJU VEGETABLES • ${today}</div><h1>Good morning, Raju <span>👋</span></h1><p>Everything you need to run today's vegetable business, in one place.</p></div>
   <div class="hero-badge"><span>🥬</span><small>Fresh<br>Simple<br>Trusted</small></div>
 </div>
 <div class="dashboard-section-title"><div><h3>Today's Overview</h3><p class="muted">Your business at a glance</p></div></div>
 <div class="grid dashboard-stats">
   <div class="card stat premium-stat sales-stat"><div class="stat-icon">💰</div><div class="label">Today's Sales</div><div class="num">${money(p.revenue)}</div><div class="stat-foot">Sales recorded today</div></div>
   <div class="card stat premium-stat expense-stat"><div class="stat-icon">💸</div><div class="label">Today's Expenses</div><div class="num">${money(p.expense)}</div><div class="stat-foot">Business expenses</div></div>
   <div class="card stat premium-stat profit-stat"><div class="stat-icon">📈</div><div class="label">Net Profit</div><div class="num">${money(p.profit)}</div><div class="stat-foot">After estimated costs</div></div>
   <div class="card stat premium-stat due-stat"><div class="stat-icon">👥</div><div class="label">Customer Due</div><div class="num">${money(dueAll)}</div><div class="stat-foot">${customerCount} customer${customerCount===1?'':'s'} tracked</div></div>
 </div>
 <div class="dashboard-section-title quick-title"><div><h3>Quick Actions</h3><p class="muted">Most-used actions for daily work</p></div></div>
 <div class="quick-grid premium-quick-grid">
   <button class="quick-action premium-quick" onclick="owner('sales')"><span>🧾</span><b>Sale / Bill</b><small>Create a customer bill</small></button>
   <button class="quick-action premium-quick" onclick="owner('customers')"><span>👥</span><b>Customers</b><small>View dues & accounts</small></button>
   <button class="quick-action premium-quick" onclick="owner('payments')"><span>💳</span><b>Payment</b><small>Record customer payment</small></button>
   <button class="quick-action premium-quick" onclick="owner('purchases')"><span>🛒</span><b>Purchase</b><small>Add morning purchases</small></button>
   <button class="quick-action premium-quick" onclick="owner('expenses')"><span>💸</span><b>Expense</b><small>Record daily expense</small></button>
 </div>
 <div class="dashboard-lower">
   <div class="card insight-card"><div class="insight-icon">🌿</div><div><h3>Today's Focus</h3><p class="muted">Keep every customer bill and payment updated immediately so the due amount stays accurate.</p></div></div>
   <div class="card insight-card gold-insight"><div class="insight-icon">✨</div><div><h3>Profit Rule</h3><p class="muted">Net profit = sales − estimated cost of vegetables sold − expenses.</p></div></div>
 </div>`;
}
function purchasePage(){
 let x=db();return `<div class="card"><form onsubmit="event.preventDefault();addPurchase(this)"><div class="formgrid"><div><label>Date</label><input name="date" type="date" value="${date()}"></div><div><label>Vegetable</label><input name="name" required placeholder="Tomato"></div><div><label>Purchase Type</label><select name="unit"><option>Box</option><option>Bag</option><option>Kg</option><option>Piece</option></select></div><div><label>Quantity</label><input name="qty" type="number" min="0.01" step="0.01" required></div><div><label>Weight / unit (kg)</label><input name="weight" type="number" min="0" step="0.01"></div><div><label>Price / unit (₹)</label><input name="cost" type="number" min="0" step="0.01" required></div><div><label>Dealer</label><input name="dealer" placeholder="Dealer name"></div></div><button class="btn primary" style="margin-top:15px">Save Purchase</button></form></div>
 <div class="section"><h3>Purchase History</h3></div><div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Vegetable</th><th>Type</th><th>Qty</th><th>Weight</th><th>Price</th><th>Total</th></tr>${x.purchases.slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${esc(p.name)}</td><td>${p.unit}</td><td>${p.qty}</td><td>${p.weight||"-"} kg</td><td>${money(p.cost)}</td><td>${money(p.total)}</td></tr>`).join("")||`<tr><td colspan="7" class="empty">No purchases yet.</td></tr>`}</table></div>`;
}
function addPurchase(f){let x=db(),d=new FormData(f),q=+d.get("qty"),c=+d.get("cost");if(q<=0||c<0)return alert("Enter valid values.");x.purchases.push({id:id("pur"),date:d.get("date")||date(),name:d.get("name").trim(),unit:d.get("unit"),qty:q,weight:+d.get("weight")||0,cost:c,total:q*c,dealer:d.get("dealer")||""});save(x);msg("Purchase saved");owner("purchases")}
function inventoryPage(){
 let x=db(),m={};x.purchases.forEach(p=>{let k=p.name.toLowerCase();m[k]??={name:p.name,qty:0,value:0};m[k].qty+=p.qty;m[k].value+=p.total});x.sales.forEach(s=>{let k=s.name.toLowerCase();if(m[k])m[k].qty-=s.qty});
 return `<div class="card"><p class="muted">Available quantity = purchases − recorded sales. Unsold stock remains available.</p></div><div class="card tablewrap"><table class="table"><tr><th>Vegetable</th><th>Available Qty</th><th>Purchase Value</th><th>Avg Cost / unit</th></tr>${Object.values(m).map(v=>`<tr><td>${esc(v.name)}</td><td>${v.qty.toFixed(2)}</td><td>${money(v.value)}</td><td>${v.qty?money(v.value/v.qty):money(0)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No inventory.</td></tr>`}</table></div>`;
}
function salesPage(){
 let x=db();return `<div class="card"><h3>Create Sale / Customer Bill</h3><form id="billform" onsubmit="event.preventDefault();saveBill()"><div class="formgrid"><div><label>Date</label><input id="bdate" type="date" value="${date()}"></div><div><label>Customer</label><select id="bcustomer"><option value="">Cash / Walk-in</option>${x.customers.map(c=>`<option value="${c.id}">${esc(c.name)} - ${esc(c.phone||"")}</option>`).join("")}</select></div></div><div style="margin-top:16px"><label>Bill Items</label><div id="billitems"></div><button type="button" class="btn secondary" onclick="addBillLine()">+ Add Vegetable</button></div><div class="bill-total">Total: <span id="btotal">₹0.00</span></div><div class="formgrid"><div><label>Amount Paid</label><input id="bpaid" type="number" min="0" step="0.01" value="0"></div><div><label>Payment Method</label><select id="bmethod"><option>Cash</option><option>UPI</option><option>Bank</option></select></div></div><div class="actions" style="margin-top:16px"><button class="btn primary">Save Bill</button></div></form></div>
 <div class="section"><h3>Recent Bills</h3></div><div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Customer</th><th>Total</th><th>Paid</th><th>Due</th><th>Action</th></tr>${x.sales.filter(s=>s.billId).reduce((a,s)=>{let z=a.find(v=>v.billId===s.billId);if(!z){z={billId:s.billId,date:s.date,customerId:s.customerId,total:0,paid:0};a.push(z)}z.total+=s.total;return a},[]).slice().reverse().map(b=>{let paid=x.payments.filter(p=>p.billId===b.billId).reduce((a,p)=>a+p.amount,0);return `<tr><td>${b.date}</td><td>${customerName(b.customerId)}</td><td>${money(b.total)}</td><td>${money(paid)}</td><td>${money(b.total-paid)}</td><td><button class="btn secondary" onclick="showBill('${b.billId}')">View / Share</button></td></tr>`}).join("")||`<tr><td colspan="6" class="empty">No bills yet.</td></tr>`}</table></div>`;
}
let billLines=[];
function addBillLine(){billLines.push({name:"",qty:1,price:0});renderBillLines()}
function renderBillLines(){let el=document.getElementById("billitems");if(!el)return;el.innerHTML=billLines.map((b,i)=>`<div class="billline"><div><input placeholder="Vegetable" value="${esc(b.name)}" oninput="billLines[${i}].name=this.value"></div><div><input type="number" min="0.01" step="0.01" value="${b.qty}" oninput="billLines[${i}].qty=+this.value;updateBillTotal()"></div><div><input type="number" min="0" step="0.01" value="${b.price}" oninput="billLines[${i}].price=+this.value;updateBillTotal()"></div><div class="lineTotal">${money(b.qty*b.price)}</div><button type="button" class="btn danger" onclick="billLines.splice(${i},1);renderBillLines()">×</button></div>`).join("")||`<p class="muted">Add at least one vegetable.</p>`;updateBillTotal()}
function updateBillTotal(){let t=sum(billLines,b=>b.qty*b.price);let e=document.getElementById("btotal");if(e)e.textContent=money(t);document.querySelectorAll(".lineTotal").forEach((e,i)=>e.textContent=money(billLines[i].qty*billLines[i].price))}
function saveBill(){
 let x=db(),cust=document.getElementById("bcustomer").value||null,d=document.getElementById("bdate").value||date(),paid=+document.getElementById("bpaid").value||0,total=sum(billLines,b=>b.qty*b.price);
 if(!billLines.length||billLines.some(b=>!b.name||b.qty<=0||b.price<0))return alert("Add valid bill items.");
 if(paid>total)return alert("Payment cannot exceed bill total.");
 let bid=id("bill");
 billLines.forEach(b=>x.sales.push({id:id("sale"),billId:bid,date:d,name:b.name.trim(),qty:+b.qty,price:+b.price,total:b.qty*b.price,customerId:cust}));
 if(cust&&paid>0)x.payments.push({id:id("pay"),date:d,customerId:cust,amount:paid,method:document.getElementById("bmethod").value,billId:bid});
 save(x);billLines=[];msg("Bill saved");showBill(bid)}
function showBill(bid,options={}){
 let x=db(),items=x.sales.filter(s=>s.billId===bid);if(!items.length)return;
 const target={type:"bill",page:ownerPage||"sales",customerId:selectedCustomerId||null,billId:bid};
 if(options.skipHistory)currentView=target;else pushView(target);
 const total=sum(items,s=>s.total),paid=sum(x.payments.filter(p=>p.billId===bid),p=>p.amount),dueAmt=total-paid,c=items[0].customerId?x.customers.find(c=>c.id===items[0].customerId):null;
 if(user)saveSession(target.page,target.customerId);
 const text=billText(items,total,paid,dueAmt,c);
 const backLabel=target.page==="customers"?"← Back to Customer":"← Back to Bills";
 document.getElementById("content").innerHTML=`<div class="card"><div class="section"><div><h3>🧾 RAJU VEGETABLES — Bill</h3><p class="muted">${esc(c?.name||"Cash Customer")} · ${esc(items[0].date)}</p></div><span class="pill ${dueAmt>0?'redpill':''}">${dueAmt>0?'Due':'Paid'} ${money(dueAmt)}</span></div><div class="sharebox">${esc(text)}</div><div class="actions" style="margin-top:14px"><button class="btn primary" type="button" onclick="shareBillImage('${bid}')">🖼️ Share Bill as Image</button><button class="btn secondary" type="button" onclick="downloadBillImage('${bid}')">⬇️ Save Image</button><button class="btn secondary" type="button" onclick='shareText(${JSON.stringify(text)})'>📤 Share Text</button><button class="btn secondary" type="button" onclick="printBill(${JSON.stringify(text)})">🖨️ Print</button><button class="btn secondary" type="button" onclick="appBack()">${backLabel}</button></div></div>`;
}

function billText(items,total,paid,dueAmt,c){

function makeBillImageFile(bid){
  const x=db(),items=x.sales.filter(s=>s.billId===bid);
  if(!items.length)throw new Error('Bill not found');
  const total=sum(items,s=>s.total),paid=sum(x.payments.filter(p=>p.billId===bid),p=>p.amount),dueAmt=total-paid;
  const c=items[0].customerId?x.customers.find(c=>c.id===items[0].customerId):null;
  const W=1000,rowH=62,headerH=430,footerH=105,H=headerH+items.length*rowH+footerH;
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0b5d2b';ctx.textAlign='center';ctx.font='900 38px Arial';ctx.fillText('RAJU VEGETABLES',W/2,60);
  ctx.fillStyle='#68746c';ctx.font='600 20px Arial';ctx.fillText('CUSTOMER BILL',W/2,92);
  ctx.strokeStyle='#16803c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(55,120);ctx.lineTo(W-55,120);ctx.stroke();
  ctx.textAlign='left';ctx.fillStyle='#172019';ctx.font='700 20px Arial';ctx.fillText('Customer',60,165);ctx.font='400 21px Arial';ctx.fillText(c?c.name:'Cash Customer',60,198);
  if(c&&c.phone)ctx.fillText(c.phone,60,228);
  ctx.textAlign='right';ctx.font='700 20px Arial';ctx.fillText('Date',W-60,165);ctx.font='400 21px Arial';ctx.fillText(items[0].date,W-60,198);
  ctx.fillStyle='#f4f8f5';ctx.fillRect(50,260,W-100,54);
  ctx.fillStyle='#0b5d2b';ctx.font='700 18px Arial';ctx.textAlign='left';ctx.fillText('Vegetable',70,295);ctx.fillText('Qty',560,295);ctx.fillText('Rate',680,295);ctx.textAlign='right';ctx.fillText('Amount',930,295);
  ctx.strokeStyle='#dce5de';ctx.lineWidth=1;
  items.forEach((it,i)=>{const y=350+i*rowH;ctx.fillStyle='#172019';ctx.font='400 19px Arial';ctx.textAlign='left';ctx.fillText(String(it.name).slice(0,42),70,y);ctx.fillText(String(it.qty),560,y);ctx.fillText(money(it.price),680,y);ctx.textAlign='right';ctx.fillText(money(it.total),930,y);ctx.beginPath();ctx.moveTo(55,y+18);ctx.lineTo(945,y+18);ctx.stroke();});
  const ty=350+items.length*rowH+18;
  ctx.textAlign='left';ctx.fillStyle='#68746c';ctx.font='600 19px Arial';ctx.fillText('Subtotal',650,ty);ctx.textAlign='right';ctx.fillStyle='#172019';ctx.font='700 19px Arial';ctx.fillText(money(total),930,ty);
  ctx.textAlign='left';ctx.fillStyle='#68746c';ctx.font='600 19px Arial';ctx.fillText('Paid',650,ty+42);ctx.textAlign='right';ctx.fillStyle='#172019';ctx.font='700 19px Arial';ctx.fillText(money(paid),930,ty+42);
  ctx.strokeStyle='#16803c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(640,ty+60);ctx.lineTo(945,ty+60);ctx.stroke();
  ctx.textAlign='left';ctx.fillStyle='#172019';ctx.font='900 22px Arial';ctx.fillText('BALANCE DUE',650,ty+98);ctx.textAlign='right';ctx.fillStyle='#c62828';ctx.fillText(money(dueAmt),930,ty+98);
  ctx.textAlign='center';ctx.fillStyle='#68746c';ctx.font='400 17px Arial';ctx.fillText('Thank you for shopping with RAJU VEGETABLES',W/2,H-38);
  // Synchronous conversion keeps the user-activation window alive for navigator.share().
  const dataUrl=canvas.toDataURL('image/png');
  const bin=atob(dataUrl.split(',')[1]);
  const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const blob=new Blob([bytes],{type:'image/png'});
  const file=new File([blob],`RAJU-VEGETABLES-BILL-${items[0].date}.png`,{type:'image/png'});
  return {blob,file,dataUrl};
}

function shareBillImage(bid){
  try{
    const {blob,file,dataUrl}=makeBillImageFile(bid);
    const existing=document.getElementById('billImagePreview');if(existing)existing.remove();
    const wrap=document.createElement('div');wrap.id='billImagePreview';wrap.className='image-preview-modal';
    wrap.innerHTML=`<div class="image-preview-card"><div class="section"><h3>🧾 RAJU VEGETABLES Bill</h3><button class="btn secondary" type="button" id="closeBillPreviewBtn">✕</button></div><img src="${dataUrl}" alt="RAJU VEGETABLES bill"><p class="muted" id="imageShareStatus">Bill image is ready.</p><div class="actions"><button class="btn primary" type="button" id="nativeImageShareBtn">📤 Share Image</button><button class="btn secondary" type="button" id="downloadImageBtn">⬇️ Save Image</button></div></div>`;
    document.body.appendChild(wrap);
    document.getElementById('closeBillPreviewBtn').onclick=closeBillImagePreview;
    document.getElementById('downloadImageBtn').onclick=()=>saveBlobAsFile(blob,file.name);
    document.getElementById('nativeImageShareBtn').onclick=()=>shareImageFile(file);
  }catch(e){console.error(e);alert('Could not create the bill image. Please try again.');}
}

async function shareImageFile(file){
  const status=document.getElementById('imageShareStatus');
  try{
    if(!navigator.share||!navigator.canShare){
      if(status)status.textContent='Image sharing is not supported here. Tap Save Image and attach it in WhatsApp.';
      else saveBlobAsFile(file,file.name);
      return;
    }
    if(!navigator.canShare({files:[file]})){
      if(status)status.textContent='This browser cannot share image files. Tap Save Image and attach it in WhatsApp.';
      return;
    }
    // IMPORTANT: this call is directly inside the button click handler.
    await navigator.share({files:[file],title:'RAJU VEGETABLES Bill'});
    if(status)status.textContent='Image shared successfully.';
  }catch(e){
    if(e&&e.name==='AbortError')return;
    console.error('Image share failed:',e);
    if(status)status.textContent='Image sharing failed. Tap Save Image and attach the PNG in WhatsApp.';
  }
}

function saveBlobAsFile(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);msg('Bill image saved. Attach the PNG in WhatsApp.');}
function closeBillImagePreview(){const el=document.getElementById('billImagePreview');if(el)el.remove();}
function downloadBillImage(bid){try{const {blob,file}=makeBillImageFile(bid);saveBlobAsFile(blob,file.name)}catch(e){console.error(e);alert('Could not create the bill image. Please try again.')}}

async function shareText(t,phone=""){
  const waPhone=(phone||"").replace(/\D/g,"");
  if(navigator.share){
    try{await navigator.share({title:"RAJU VEGETABLES",text:t});return true}
    catch(e){if(e&&e.name==="AbortError")return false;}
  }
  if(navigator.clipboard&&window.isSecureContext){
    try{await navigator.clipboard.writeText(t);alert("Statement copied. Paste it into WhatsApp.");return true}catch(e){}
  }
  if(waPhone){window.open("https://wa.me/"+waPhone+"?text="+encodeURIComponent(t),"_blank");return true}
  alert("Sharing is not available in this browser. Please copy the statement manually.");
  return false;
}

function addCustomer(f){let x=db(),d=new FormData(f),name=(d.get('name')||'').trim(),phone=(d.get('phone')||'').trim(),openingDue=+d.get('openingDue')||0;if(!name)return alert('Enter customer name.');x.customers.push({id:id('cust'),name,phone,address:(d.get('address')||'').trim(),openingDue,createdAt:date()});save(x);msg('Customer added');customerDetail(x.customers[x.customers.length-1].id)}
function customerTransactionRows(cid){
 let x=db(),c=x.customers.find(c=>c.id===cid),rows=[];
 if(!c)return rows;
 if(Number(c.openingDue||0)>0)rows.push({date:c.createdAt||'Previous',kind:'previous',title:'Previous Due',amount:Number(c.openingDue||0),order:0});
 const bills={};
 x.sales.filter(s=>s.customerId===cid&&s.billId).forEach(s=>{if(!bills[s.billId])bills[s.billId]={date:s.date,billId:s.billId,total:0,manual:false,description:''};bills[s.billId].total+=Number(s.total||0);if(s.manualCredit){bills[s.billId].manual=true;bills[s.billId].description=s.name||'Added Due'}});
 Object.values(bills).forEach(b=>rows.push({date:b.date,kind:b.manual?'credit':'bill',title:b.manual?`Added Due — ${b.description}`:'Bill',amount:b.total,order:1,billId:b.billId}));
 x.payments.filter(p=>p.customerId===cid).forEach(p=>rows.push({date:p.date,kind:'payment',title:`Payment${p.method?` — ${p.method}`:''}`,amount:-Number(p.amount||0),order:2,paymentId:p.id,billId:p.billId||''}));
 rows.sort((a,b)=>String(a.date).localeCompare(String(b.date))||a.order-b.order);
 let balance=0;return rows.map(r=>({...r,balance:(balance+=r.amount)}));
}

function customerStatementPreview(cid){try{const {blob,file,dataUrl}=customerStatementImageFile(cid),x=db(),c=x.customers.find(c=>c.id===cid);const old=document.getElementById('customerStatementPreview');if(old)old.remove();const wrap=document.createElement('div');wrap.id='customerStatementPreview';wrap.className='image-preview-modal';wrap.innerHTML=`<div class="image-preview-card"><div class="section"><h3>🧾 ${esc(c.name)} — Statement</h3><button class="btn secondary" type="button" id="closeCustomerStatement">✕</button></div><img src="${dataUrl}" alt="RAJU VEGETABLES customer statement"><p class="muted" id="customerStatementStatus">Complete statement image is ready.</p><div class="actions"><button class="btn primary" type="button" id="shareCustomerStatement">📤 Share Image</button><button class="btn secondary" type="button" id="saveCustomerStatement">⬇️ Save Image</button></div></div>`;document.body.appendChild(wrap);document.getElementById('closeCustomerStatement').onclick=()=>wrap.remove();document.getElementById('saveCustomerStatement').onclick=()=>saveBlobAsFile(blob,file.name);document.getElementById('shareCustomerStatement').onclick=()=>shareImageFile(file)}catch(e){console.error(e);alert('Could not create the customer statement image. Please try again.')}}

function paymentPage(){
 let x=db();return `<div class="card"><form onsubmit="event.preventDefault();addPayment(this)"><div class="formgrid"><div><label>Date</label><input name="date" type="date" value="${date()}"></div><div><label>Customer</label><select name="customer" required><option value="">Select</option>${x.customers.map(c=>`<option value="${c.id}">${esc(c.name)} — Due ${money(due(c))}</option>`).join("")}</select></div><div><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Method</label><select name="method"><option>Cash</option><option>UPI</option><option>Bank</option></select></div></div><button class="btn primary" style="margin-top:15px">Record Payment</button></form></div><div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Customer</th><th>Amount</th><th>Method</th></tr>${x.payments.slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${esc(customerName(p.customerId))}</td><td>${money(p.amount)}</td><td>${p.method}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No payments.</td></tr>`}</table></div>`;
}
function addPayment(f){let x=db(),d=new FormData(f),a=+d.get("amount"),c=x.customers.find(c=>c.id===d.get("customer"));if(!c||a<=0)return alert("Enter valid payment.");if(a>due(c)+0.001)return alert("Payment cannot exceed current due.");x.payments.push({id:id("pay"),date:d.get("date")||date(),customerId:c.id,amount:a,method:d.get("method")});save(x);msg("Payment recorded");owner("payments")}
function expensePage(){
 let x=db();return `<div class="card"><form onsubmit="event.preventDefault();addExpense(this)"><div class="formgrid"><div><label>Date</label><input name="date" type="date" value="${date()}"></div><div><label>Expense Type</label><select name="type"><option>Worker Fee</option><option>Covers Fee</option><option>Swachh Bharat Workers Tips</option><option>Transport</option><option>Loading / Unloading</option><option>Market Fee</option><option>Food / Tea</option><option>Other</option></select></div><div><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Notes</label><input name="notes"></div></div><button class="btn primary" style="margin-top:15px">Save Expense</button></form></div><div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Type</th><th>Notes</th><th>Amount</th></tr>${x.expenses.slice().reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.type)}</td><td>${esc(e.notes||"")}</td><td>${money(e.amount)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No expenses.</td></tr>`}</table></div>`;
}
function addExpense(f){let x=db(),d=new FormData(f);x.expenses.push({id:id("exp"),date:d.get("date")||date(),type:d.get("type"),amount:+d.get("amount"),notes:d.get("notes")||""});save(x);msg("Expense saved");owner("expenses")}
function pricePage(){
 let x=db();return `<div class="card"><form onsubmit="event.preventDefault();setPrice(this)"><div class="formgrid"><div><label>Date</label><input name="date" type="date" value="${date()}"></div><div><label>Vegetable</label><input name="name" required></div><div><label>Selling Price / kg</label><input name="price" type="number" min="0" step="0.01" required></div></div><button class="btn primary" style="margin-top:15px">Set Price</button></form></div><div class="pricegrid">${x.prices.filter(p=>p.date===date()).map(p=>`<div class="price"><h3>${esc(p.name)}</h3><strong style="font-size:22px">${money(p.price)}</strong><p class="muted">per kg</p></div>`).join("")||`<div class="card empty">No prices set today.</div>`}</div>`;
}
function setPrice(f){let x=db(),d=new FormData(f),dt=d.get("date")||date(),n=d.get("name").trim();x.prices=x.prices.filter(p=>!(p.date===dt&&p.name.toLowerCase()===n.toLowerCase()));x.prices.push({id:id("price"),date:dt,name:n,price:+d.get("price"),unit:"kg"});save(x);msg("Price saved");owner("prices")}
function profitPage(){let p=profit(date()),target=db().settings.target;return `<div class="grid"><div class="card stat"><div class="label">Sales</div><div class="num">${money(p.revenue)}</div></div><div class="card stat"><div class="label">Estimated COGS</div><div class="num">${money(p.cogs)}</div></div><div class="card stat"><div class="label">Expenses</div><div class="num">${money(p.expense)}</div></div><div class="card stat"><div class="label">Net Profit</div><div class="num">${money(p.profit)}</div></div></div><div class="card"><h3>Minimum Daily Profit Target</h3><p class="muted">Current target: ${money(target)}</p><form onsubmit="event.preventDefault();let x=db();x.settings.target=+document.getElementById('target').value||0;save(x);msg('Target updated');owner('profit')"><label>Change target</label><input id="target" type="number" step="0.01" value="${target}"><button class="btn primary" style="margin-top:12px">Save Target</button></form></div>`}
function reportPage(){let x=db(),ds=[...new Set([...x.sales.map(s=>s.date),...x.expenses.map(e=>e.date),...x.purchases.map(p=>p.date)])].sort().reverse();return `<div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Sales</th><th>COGS</th><th>Expenses</th><th>Net Profit</th></tr>${ds.map(d=>{let p=profit(d);return `<tr><td>${d}</td><td>${money(p.revenue)}</td><td>${money(p.cogs)}</td><td>${money(p.expense)}</td><td>${money(p.profit)}</td></tr>`}).join("")||`<tr><td colspan="5" class="empty">No report data.</td></tr>`}</table></div>`}

const customerNav={dashboard:"🏠 Dashboard",prices:"🏷️ Today's Prices",bills:"🧾 My Bills",payments:"💳 My Payments",ledger:"📄 My Ledger",profile:"👤 Profile"};

function customerMore(){return `<div class="mobile-more" id="customerMore">${Object.entries(customerNav).filter(([k])=>!["dashboard","bills","payments"].includes(k)).map(([k,v])=>`<button onclick="toggleCustomerMore();customer('${k}')">${v}</button>`).join("")}<button onclick="logout()">🚪 Logout</button></div>`}

function myCustomer(){let x=db();return x.customers.find(c=>c.id===user.id)||x.customers.find(c=>c.phone===user.phone)||{id:user.id,name:user.name,phone:user.phone,openingDue:0}}
function customerDash(){let c=myCustomer(),x=db();return `<div class="grid"><div class="card stat"><div class="label">Current Due</div><div class="num">${money(due(c))}</div></div><div class="card stat"><div class="label">Bills</div><div class="num">${x.sales.filter(s=>s.customerId===c.id&&s.billId).map(s=>s.billId).filter((v,i,a)=>a.indexOf(v)===i).length}</div></div><div class="card stat"><div class="label">Payments</div><div class="num">${money(sum(x.payments.filter(p=>p.customerId===c.id),p=>p.amount))}</div></div><div class="card stat"><div class="label">Prices Today</div><div class="num">${x.prices.filter(p=>p.date===date()).length}</div></div></div><div class="card"><h3>Welcome, ${esc(c.name)}</h3><p class="muted" style="margin-top:8px">This account can only access its own bills, payments, due and published prices.</p></div>`}
function customerPrices(){let x=db();return `<div class="pricegrid">${x.prices.filter(p=>p.date===date()).map(p=>`<div class="price"><h3>${esc(p.name)}</h3><strong style="font-size:22px">${money(p.price)}</strong><p class="muted">per ${p.unit}</p></div>`).join("")||`<div class="card empty">Prices have not been published yet.</div>`}</div>`}
function customerBills(){let c=myCustomer(),x=db(),bs=[...new Set(x.sales.filter(s=>s.customerId===c.id&&s.billId).map(s=>s.billId))];return `<div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Total</th><th>Paid</th><th>Balance</th><th></th></tr>${bs.map(b=>{let it=x.sales.filter(s=>s.billId===b),t=sum(it,s=>s.total),p=sum(x.payments.filter(q=>q.billId===b),q=>q.amount);return `<tr><td>${it[0].date}</td><td>${money(t)}</td><td>${money(p)}</td><td>${money(t-p)}</td><td><button class="btn secondary" onclick="customerBill('${b}')">View</button></td></tr>`}).join("")||`<tr><td colspan="5" class="empty">No bills.</td></tr>`}</table></div>`}
function customerBill(bid){
  let x=db(),it=x.sales.filter(s=>s.billId===bid),t=sum(it,s=>s.total),p=sum(x.payments.filter(q=>q.billId===bid),q=>q.amount),d=t-p,c=myCustomer();
  let text=billText(it,t,p,d,c);
  document.getElementById("content").innerHTML=`<div class="card"><div class="section"><div><h3>🧾 RAJU VEGETABLES — Bill</h3><p class="muted">${esc(c.name)} · ${esc(it[0]?.date||date())}</p></div><span class="pill ${d>0?'redpill':''}">Due ${money(d)}</span></div><div class="sharebox">${esc(text)}</div><div class="actions" style="margin-top:14px"><button class="btn primary" type="button" onclick="shareBillImage('${bid}')">🖼️ Share as Image</button><button class="btn secondary" type="button" onclick="downloadBillImage('${bid}')">⬇️ Save Image</button><button class="btn secondary" type="button" onclick='shareText(${JSON.stringify(text)})'>📤 Share Text</button><button class="btn secondary" type="button" onclick="appBack()">← Back</button></div></div>`;
}

function customerPayments(){let c=myCustomer(),x=db();return `<div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Amount</th><th>Method</th></tr>${x.payments.filter(p=>p.customerId===c.id).slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${money(p.amount)}</td><td>${p.method}</td></tr>`).join("")||`<tr><td colspan="3" class="empty">No payments.</td></tr>`}</table></div>`}
function customerLedger(){let c=myCustomer(),x=db(),rows=[];if(c.openingDue)rows.push({date:"Opening",desc:"Opening Due",amt:c.openingDue});x.sales.filter(s=>s.customerId===c.id).forEach(s=>rows.push({date:s.date,desc:"Bill - "+s.name,amt:s.total}));x.payments.filter(p=>p.customerId===c.id).forEach(p=>rows.push({date:p.date,desc:"Payment",amt:-p.amount}));let b=0;return `<div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Description</th><th>Amount</th><th>Balance</th></tr>${rows.map(r=>{b+=r.amt;return `<tr><td>${r.date}</td><td>${esc(r.desc)}</td><td>${r.amt>=0?money(r.amt):"-"+money(-r.amt)}</td><td>${money(b)}</td></tr>`}).join("")||`<tr><td colspan="4" class="empty">No ledger entries.</td></tr>`}</table></div>`}
function customerProfile(){let c=myCustomer();return `<div class="card"><h3>${esc(c.name)}</h3><p class="muted" style="margin-top:10px">Phone: ${esc(c.phone||"-")}</p><p class="muted">Address: ${esc(c.address||"-")}</p></div>`}

if(!localStorage.getItem(KEY))save(seed());
migrateOwnerLogin();

function restoreOrLogin(){
  const s=loadSession();
  if(s){
    const x=db(),u=x.users.find(a=>a.id===s.userId&&a.role==="owner")||x.users.find(a=>a.id==="owner"&&a.role==="owner");
    if(u){
      user=u;viewStack=[];selectedCustomerId=s.customerId||null;
      if(s.viewType==="bill"&&s.billId&&x.sales.some(a=>a.billId===s.billId)){
        ownerPage=s.page||"sales";currentView={type:"bill",page:ownerPage,customerId:selectedCustomerId||null,billId:s.billId};showBill(s.billId,{skipHistory:true});return;
      }
      if(s.viewType==="customerDetail"&&selectedCustomerId&&x.customers.some(c=>c.id===selectedCustomerId)){
        ownerPage="customers";currentView={type:"customerDetail",page:"customers",customerId:selectedCustomerId};customerDetail(selectedCustomerId,{skipHistory:true});return;
      }
      ownerPage=s.page||"dashboard";selectedCustomerId=null;owner(ownerPage,{skipHistory:true});return;
    }
  }
  clearSession();currentView=null;viewStack=[];loginScreen("owner");
}
function launchRajuApp(){
  const splash=document.getElementById("rajuSplash");
  setTimeout(()=>{
    if(splash) splash.remove();
    restoreOrLogin();
  },5000);
}
